<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Build. Prepare. Get Hired.</title>
    <script>
      // Prevent TypeError: Cannot set property fetch of #<Window> which has only a getter
      // This happens in sandboxed environments or browser extensions when they try to wrap or stub window.fetch.
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          let currentFetch = window.fetch;
          const patch = {
            get() {
              return currentFetch;
            },
            set(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', patch);
          } catch (e1) {
            try {
              const proto = Object.getPrototypeOf(window);
              if (proto) {
                Object.defineProperty(proto, 'fetch', patch);
              }
            } catch (e2) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', patch);
                }
              } catch (e3) {
                console.warn('[NexHire] fetch prototype patch failed:', e3);
              }
            }
          }
        }
      } catch (e) {
        console.warn('[NexHire] fetch patch skipped:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
